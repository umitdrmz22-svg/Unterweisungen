<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Unterweisungen – interaktive LAGI-Demo"><title>Unterweisungen · LAGI</title><style>
:root{--accent:#245fa8;--nav:#10243a;--bg:#f3f6f8;--card:#fff;--text:#17212b;--muted:#637282;--line:#d9e1e7;--danger:#b42318;--ok:#18794e;--warn:#a15c00}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.side{background:var(--nav);color:white;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:4px 6px 22px;border-bottom:1px solid #ffffff25}.brand img{width:55px;height:55px;border-radius:12px;object-fit:cover;background:white}.brand strong{display:block;font-size:19px;letter-spacing:.5px}.brand span{font-size:11px;color:#bed0df}.nav{display:grid;gap:7px;margin-top:20px}.nav button,.nav a{border:0;background:transparent;color:#d7e3ec;text-align:left;padding:12px;border-radius:9px;cursor:pointer;text-decoration:none}.nav button:hover,.nav button.active,.nav a:hover{background:#ffffff18;color:#fff}.nav-label{font-size:10px;letter-spacing:.11em;color:#8fa5b7;margin:15px 10px 0}.side-note{font-size:12px;color:#aebfcd;margin:25px 8px}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}.top h1{font-size:19px;margin:0}.top-actions{display:flex;gap:8px}.content{padding:28px;max-width:1500px;margin:auto}.hero{background:linear-gradient(125deg,var(--nav),var(--accent));color:#fff;border-radius:17px;padding:26px 28px;box-shadow:0 10px 28px #10243a22}.hero h2{margin:0 0 8px;font-size:27px}.hero p{margin:0;max-width:850px;color:#eef6fa}.stats{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px;margin:18px 0}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 14px #10243a0b}.stat{padding:18px}.stat b{display:block;font-size:27px;color:var(--accent)}.stat span{color:var(--muted);font-size:13px}.card{padding:20px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:24px 0 13px}.section-head h2{margin:0;font-size:23px}.section-head p{margin:3px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;padding:9px 12px;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{max-width:380px}.field,input,select,textarea{width:100%;border:1px solid #cbd5dc;border-radius:8px;padding:10px;background:#fff}textarea{min-height:90px;resize:vertical}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px}table{width:100%;border-collapse:collapse;background:#fff;min-width:850px}th,td{padding:12px 13px;text-align:left;border-bottom:1px solid #e8edf0;vertical-align:top}th{background:#f7f9fa;color:#536170;font-size:12px;text-transform:uppercase;letter-spacing:.03em}tr:last-child td{border-bottom:0}tr:hover td{background:#fafcfd}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf1f4;font-size:12px;white-space:nowrap}.pill.good{background:#e7f6ee;color:var(--ok)}.pill.warn{background:#fff0d6;color:var(--warn)}.pill.bad{background:#fdebea;color:var(--danger)}.row-actions{display:flex;gap:5px}.row-actions button{border:0;background:#edf2f5;border-radius:6px;padding:6px 8px;cursor:pointer}.empty{text-align:center;padding:40px;color:var(--muted)}dialog{border:0;border-radius:15px;padding:0;width:min(720px,calc(100% - 30px));box-shadow:0 25px 70px #0005}dialog::backdrop{background:#0a1624aa}.dialog-head{padding:18px 21px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:20px}.close{border:0;background:#edf1f4;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:20px}.dialog-body{padding:20px;max-height:70vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form-field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}.form-field label span{color:var(--danger)}.wide{grid-column:1/-1}.dialog-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.sources{display:grid;gap:8px}.sources a{color:var(--accent);text-decoration:none}.notice{border-left:4px solid var(--accent);padding:11px 14px;background:#f5faf9;border-radius:7px;color:#42515e}.mobile{display:none}.toast{position:fixed;right:22px;bottom:22px;background:#17212b;color:#fff;padding:11px 15px;border-radius:8px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:850px){.app{display:block}.side{position:fixed;z-index:10;transform:translateX(-100%);transition:.2s;width:275px}.side.open{transform:none}.mobile{display:inline-block}.top{padding:0 14px}.top h1{font-size:16px}.content{padding:16px}.stats{grid-template-columns:1fr 1fr}.section-head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}@media(max-width:480px){.stats{grid-template-columns:1fr}.top-actions .hide-small{display:none}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="https://umitdrmz22-svg.github.io/ba-generator/lagi-demo/assets/lagi-logo.png" alt="LAGI Logo"><div><strong>LAGI</strong><span>Legal · Arbeitsschutz · Gefahrstoffe<br>Integriertes Management</span></div></div><nav class="nav" aria-label="Modulnavigation"><button data-route="dashboard" onclick="route('dashboard')">⌂ &nbsp;Übersicht</button></nav><p class="side-note">Fiktive Demodaten · Speicherung nur im lokalen Browser</p></aside><main class="main"><header class="top"><div><button class="btn mobile" onclick="document.querySelector('.side').classList.toggle('open')" aria-label="Menü öffnen">☰</button> <h1 id="pageTitle" style="display:inline"></h1></div><div class="top-actions"><button class="btn hide-small" onclick="exportAll()">Daten exportieren</button><button class="btn" onclick="showInfo()">Info & Quellen</button></div></header><div class="content" id="content"></div></main></div><dialog id="editDialog"><form id="editForm" onsubmit="submitForm(event)"><div class="dialog-head"><h2 id="dialogTitle"></h2><button class="close" type="button" onclick="editDialog.close()" aria-label="Schließen">×</button></div><div class="dialog-body grid" id="form"></div><div class="dialog-foot"><button class="btn" type="button" onclick="editDialog.close()">Abbrechen</button><button class="btn primary" type="submit">Speichern</button></div></form></dialog><dialog id="infoDialog"><div class="dialog-head"><h2>Modulbeschreibung</h2><button class="close" onclick="infoDialog.close()" aria-label="Schließen">×</button></div><div class="dialog-body" id="infoContent"></div><div class="dialog-foot"><button class="btn danger" onclick="resetAll();infoDialog.close()">Demodaten zurücksetzen</button><button class="btn primary" onclick="infoDialog.close()">Schließen</button></div></dialog><div class="toast" role="status"></div><script>
const CFG={"title":"Unterweisungen","subtitle":"Themen, Termine und Teilnahme nachvollziehbar dokumentieren","accent":"#245fa8","storage":"lagi-unterweisung-v1","related":[["LAGI Gesamtübersicht","https://umitdrmz22-svg.github.io/ba-generator/lagi-demo/"],["Gefährdungsbeurteilungen","https://umitdrmz22-svg.github.io/Gef-hrdungsbeurteilungen/"],["BA Studio","https://umitdrmz22-svg.github.io/ba-generator/lagi-demo/#/ba"],["DMS Studio","https://umitdrmz22-svg.github.io/ba-generator/lagi-demo/#/dms"]],"intro":"Das Modul plant arbeitsplatzbezogene Unterweisungen, dokumentiert Termine und hält die Teilnahme fest. Fällige Wiederholungen werden in der Übersicht angezeigt.","sources":[["ArbSchG § 12 – Unterweisung","https://www.gesetze-im-internet.de/arbschg/__12.html"],["BetrSichV § 12 – Unterweisung","https://www.gesetze-im-internet.de/betrsichv_2015/__12.html"],["DGUV Vorschrift 1","https://publikationen.dguv.de/widgets/pdf/download/article/2909"]],"entities":[{"id":"topics","name":"Themenkatalog","singular":"Unterweisungsthema","icon":"▤","fields":[["topic","Thema","text",true],["area","Bereich / Zielgruppe","text",true],["basis","Grundlage","text",true],["trigger","Anlass","select",true,["Erstunterweisung","regelmäßig","Änderung","besonderer Anlass"]],["interval","Intervall (Monate)","number",true],["owner","Verantwortlich","text",true],["material","Unterlage / BA","text",true],["status","Status","select",true,["aktiv","überarbeiten","archiviert"]]],"seed":[{"topic":"Sicherer Umgang mit Flurförderzeugen","area":"Logistik und Wareneingang","basis":"ArbSchG § 12 / interne GBU","trigger":"regelmäßig","interval":"12","owner":"Führungskraft Logistik","material":"BA Flurförderzeuge","status":"aktiv"},{"topic":"Verhalten bei Ammoniakalarm","area":"Alle Beschäftigten","basis":"Alarm- und Gefahrenabwehrplan","trigger":"regelmäßig","interval":"12","owner":"EHS / Technik","material":"Notfallunterweisung NH3","status":"überarbeiten"}]},{"id":"sessions","name":"Termine","singular":"Unterweisungstermin","icon":"◷","fields":[["topic","Thema","text",true],["date","Termin","date",true],["shift","Bereich / Schicht","text",true],["trainer","Unterweisende Person","text",true],["language","Sprache","select",true,["Deutsch","Englisch","Türkisch","mehrsprachig"]],["planned","Teilnehmende geplant","number",true],["attended","Teilgenommen","number",true],["next","Nächste Fälligkeit","date",true],["status","Status","select",true,["geplant","durchgeführt","Nachholung offen","abgeschlossen"]]],"seed":[{"topic":"Sicherer Umgang mit Flurförderzeugen","date":"2026-09-18","shift":"Wareneingang / Frühschicht","trainer":"Interner Ausbilder","language":"Deutsch","planned":"12","attended":"10","next":"2027-09-18","status":"Nachholung offen"}]},{"id":"attendance","name":"Teilnahmen","singular":"Teilnahme","icon":"✓","fields":[["person","Mitarbeiter-ID / Name","text",true],["topic","Thema","text",true],["date","Unterwiesen am","date",true],["trainer","Unterweisende Person","text",true],["understood","Verständnis bestätigt","select",true,["ja","Klärung erforderlich"]],["proof","Dokumentationsreferenz","text",true],["next","Nächste Fälligkeit","date",true],["status","Status","select",true,["gültig","bald fällig","überfällig"]]],"seed":[{"person":"MA-DEMO-104","topic":"Sicherer Umgang mit Flurförderzeugen","date":"2026-09-18","trainer":"Interner Ausbilder","understood":"ja","proof":"UW-2026-0918-A","next":"2027-09-18","status":"gültig"}]}]};const clone=x=>JSON.parse(JSON.stringify(x));let state=load();let current='dashboard';let editId=null;const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
function seed(){return Object.fromEntries(CFG.entities.map(e=>[e.id,e.seed.map((r,i)=>({...r,id:e.id+'-'+(i+1)}))]));}
function load(){try{const x=JSON.parse(localStorage.getItem(CFG.storage));if(x&&CFG.entities.every(e=>Array.isArray(x[e.id])))return x}catch(e){}return seed()}
function save(){try{localStorage.setItem(CFG.storage,JSON.stringify(state));}catch(e){toast('Lokale Speicherung nicht verfügbar')}render()}
function ent(){return CFG.entities.find(e=>e.id===current)}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function route(id){current=id;location.hash=id;$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.route===id));$('.side').classList.remove('open');render()}
function statusClass(v=''){v=v.toLowerCase();return /(wirksam|erreicht|vollständig|freigegeben|gültig|abgeschlossen|erledigt|in ordnung|ja)/.test(v)?'good':/(offen|prüf|fällig|mangel|abweich|beanstand|gesperrt|nicht)/.test(v)?'bad':'warn'}
function isOverdue(r,e){const today=new Date().toISOString().slice(0,10);return e.fields.some(f=>['due','review','next'].includes(f[0])&&r[f[0]]&&r[f[0]]<today&&!/abgeschlossen|erledigt|wirksam|erreicht/.test((r.status||'').toLowerCase()))}
function dashboard(){let total=CFG.entities.reduce((n,e)=>n+state[e.id].length,0), overdue=CFG.entities.reduce((n,e)=>n+state[e.id].filter(r=>isOverdue(r,e)).length,0);let attention=CFG.entities.reduce((n,e)=>n+state[e.id].filter(r=>/offen|prüf|fällig|abweich|mangel|beanstand/.test((r.status||'').toLowerCase())).length,0);return `<section class="hero"><h2>${esc(CFG.title)}</h2><p>${esc(CFG.intro)}</p></section><div class="stats"><div class="stat"><b>${total}</b><span>Datensätze gesamt</span></div><div class="stat"><b>${CFG.entities.length}</b><span>Arbeitsbereiche</span></div><div class="stat"><b>${attention}</b><span>Einträge mit Handlungsbedarf</span></div><div class="stat"><b>${overdue}</b><span>Überfällige Termine</span></div></div><div class="card"><h2>Direkteinstieg</h2><div class="actions">${CFG.entities.map(e=>`<button class="btn primary" onclick="route('${e.id}')">${e.icon} ${esc(e.name)}</button>`).join('')}</div></div><div class="card" style="margin-top:16px"><h2>Arbeitsweise</h2><p>Alle Einträge lassen sich ergänzen, bearbeiten, filtern und exportieren. Die Demodaten bleiben ausschließlich in diesem Browser gespeichert.</p><div class="notice">Die Anwendung unterstützt die strukturierte Dokumentation. Fachliche Bewertung, Freigabe, Prüffristen und Rechtskonformität bleiben Aufgabe der zuständigen betrieblichen Personen.</div></div>`}
function entityView(e){const rows=filtered(e);const cols=e.fields.slice(0,5);return `<div class="section-head"><div><h2>${e.icon} ${esc(e.name)}</h2><p>${rows.length} von ${state[e.id].length} Einträgen</p></div><div class="actions"><button class="btn" onclick="exportCsv()">CSV exportieren</button><button class="btn primary" onclick="openForm()">+ ${esc(e.singular)} anlegen</button></div></div><div class="toolbar"><input id="search" aria-label="Liste durchsuchen" placeholder="Suchen …" value="${esc(window.query||'')}" oninput="window.query=this.value;renderTable()"></div><div id="table">${table(e,rows,cols)}</div>`}
function filtered(e){const q=(window.query||'').toLowerCase().trim();return !q?state[e.id]:state[e.id].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)))}
function table(e,rows,cols=e.fields.slice(0,5)){if(!rows.length)return '<div class="card empty">Keine passenden Einträge gefunden.</div>';return `<div class="table-wrap"><table><thead><tr>${cols.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Status</th><th>Aktion</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(f=>`<td>${f[2]==='date'&&r[f[0]]?new Date(r[f[0]]+'T12:00:00').toLocaleDateString('de-DE'):esc(r[f[0]]||'—')}</td>`).join('')}<td><span class="pill ${statusClass(r.status)}">${esc(r.status||'—')}</span></td><td><div class="row-actions"><button title="Bearbeiten" onclick="openForm('${r.id}')">✎</button><button title="Löschen" onclick="removeRow('${r.id}')">⌫</button></div></td></tr>`).join('')}</tbody></table></div>`}
function renderTable(){const e=ent();$('#table').innerHTML=table(e,filtered(e),e.fields.slice(0,5));}
function render(){const title=current==='dashboard'?'Übersicht':ent()?.name||'Übersicht';$('#pageTitle').textContent=title;$('#content').innerHTML=current==='dashboard'?dashboard():entityView(ent());}
function openForm(id=null){const e=ent();editId=id;const row=id?state[e.id].find(r=>r.id===id):{};$('#dialogTitle').textContent=id?e.singular+' bearbeiten':e.singular+' anlegen';$('#form').innerHTML=e.fields.map(f=>{const [key,label,type,req,opts]=f,v=row[key]??'';const input=type==='textarea'?`<textarea name="${key}" ${req?'required':''}>${esc(v)}</textarea>`:type==='select'?`<select name="${key}" ${req?'required':''}><option value="">Bitte wählen</option>${opts.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input type="${type}" name="${key}" value="${esc(v)}" ${req?'required':''} ${type==='number'?'min="0" step="any"':''}>`;return `<div class="form-field ${type==='textarea'?'wide':''}"><label>${esc(label)} ${req?'<span>*</span>':''}</label>${input}</div>`}).join('');$('#editDialog').showModal();}
function submitForm(ev){ev.preventDefault();const e=ent(),data=Object.fromEntries(new FormData(ev.target));if(editId){const i=state[e.id].findIndex(r=>r.id===editId);state[e.id][i]={...state[e.id][i],...data}}else state[e.id].unshift({...data,id:e.id+'-'+Date.now()});$('#editDialog').close();save();toast('Eintrag gespeichert')}
function removeRow(id){if(!confirm('Diesen Eintrag wirklich löschen?'))return;const e=ent();state[e.id]=state[e.id].filter(r=>r.id!==id);save();toast('Eintrag gelöscht')}
function exportCsv(){const e=ent(),fields=e.fields,rows=state[e.id],q=v=>'"'+String(v??'').replaceAll('"','""')+'"';download(e.id+'.csv','\ufeff'+[fields.map(f=>q(f[1])).join(';'),...rows.map(r=>fields.map(f=>q(r[f[0]])).join(';'))].join('\n'),'text/csv')}
function exportAll(){download(CFG.storage+'-export.json',JSON.stringify({exportedAt:new Date().toISOString(),module:CFG.title,data:state},null,2),'application/json')}
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function resetAll(){if(!confirm('Alle lokalen Änderungen verwerfen und Demodaten wiederherstellen?'))return;state=seed();localStorage.removeItem(CFG.storage);route('dashboard');toast('Demodaten wiederhergestellt')}
function showInfo(){const links=CFG.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join('');$('#infoContent').innerHTML=`<p>${esc(CFG.intro)}</p><h3>Offizielle Grundlagen</h3><ul class="sources">${links}</ul><p class="notice">Die Links dienen als Einstieg. Für den konkreten Betrieb sind Anwendungsbereich, Genehmigungen, Gefährdungen und weitere einschlägige Vorschriften gesondert zu prüfen.</p>`;$('#infoDialog').showModal()}
let toastTimer;function toast(t){const el=$('.toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
CFG.entities.forEach(e=>{const b=document.createElement('button');b.dataset.route=e.id;b.innerHTML=`${e.icon} &nbsp;${esc(e.name)}`;b.onclick=()=>route(e.id);$('.nav').appendChild(b)});const label=document.createElement('p');label.className='nav-label';label.textContent='VERBUNDENE MODULE';$('.nav').appendChild(label);CFG.related.forEach(([name,url])=>{const a=document.createElement('a');a.href=url;a.textContent='↗  '+name;$('.nav').appendChild(a)});window.addEventListener('hashchange',()=>route(location.hash.slice(1)||'dashboard'));document.addEventListener('keydown',e=>{if(e.key==='Escape')$$('dialog[open]').forEach(d=>d.close())});route(location.hash.slice(1)||'dashboard');
</script></body></html>
